name: Build and Push Go Base Image
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch
        required: true
        default: dev
      tag:
        description: Immutable base image tag (Db2 adds -db2)
        required: true
        default: go1.26.3-wisp0.2.15-chen1
permissions:
  contents: read
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - platforms: linux/amd64,linux/arm64
            db2: '0'
            suffix: ''
          - platforms: linux/amd64
            db2: '1'
            suffix: '-db2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-base
          platforms: ${{ matrix.platforms }}
          build-args: WITH_DB2=${{ matrix.db2 }}
          push: true
          tags: jumpserver/chen-base:${{ inputs.tag }}${{ matrix.suffix }}
# Update CHEN_BASE_IMAGE deliberately in review after publishing a new base.
# This workflow does not rewrite source or push a commit back to the branch.
