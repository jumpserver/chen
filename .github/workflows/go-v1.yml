name: Chen Go
on:
  pull_request:
    paths: ['go.mod', 'go.sum', 'cmd/**', 'internal/**', 'third_party/**', 'conf/**', 'Dockerfile*', 'docker-compose*.yml', 'Makefile', 'entrypoint.sh', 'start.sh', 'scripts/**', '.github/workflows/**']
  push:
    branches: [dev]
    paths: ['go.mod', 'go.sum', 'cmd/**', 'internal/**', 'third_party/**', 'conf/**', 'Dockerfile*', 'docker-compose*.yml', 'Makefile', 'entrypoint.sh', 'start.sh', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: cd third_party/dm && go build ./...
      - run: go vet ./...
      - run: bash -n start.sh entrypoint.sh scripts/*.sh
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.wisp-dev.yml config --quiet
  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PLATFORM: ${{ matrix.platform }}
      VERSION: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build formal base, CE and EE chain
        run: make image-ee
