name: Create Go Release Assets
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            db2: '0'
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            db2: '0'
          - runner: ubuntu-24.04
            platform: linux/amd64
            db2: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and accept the exact release image
        env:
          VERSION: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          WITH_DB2: ${{ matrix.db2 }}
        run: |
          make test vet image
          suffix=''
          if [ "$WITH_DB2" = 1 ]; then suffix='-db2'; fi
          image="jumpserver/chen:${VERSION}${suffix}-ce"
          ./scripts/smoke-image.sh "$image" "$PLATFORM" "$WITH_DB2"
          make package CHEN_IMAGE="$image"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            build/*.tar.gz
            build/*.sha256
