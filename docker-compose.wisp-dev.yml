# Optional separate Wisp process for debugging. Uses the same pinned build.
# docker compose -f docker-compose.yml -f docker-compose.wisp-dev.yml up
services:
  chen:
    command: ["backend", "--wisp-insecure"]
    environment:
      CHEN_WISP_ADDRESS: wisp:9090
    depends_on:
      wisp:
        condition: service_healthy
  wisp:
    image: ${CHEN_IMAGE:-jumpserver/chen:dev-ce}
    command: ["wisp-only"]
    environment:
      COMPONENT_NAME: chen
      CORE_HOST: ${CORE_HOST:-http://host.docker.internal:8080}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      BIND_HOST: 0.0.0.0
      BIND_PORT: "9090"
      WORK_DIR: /opt/chen
      EXECUTE_PROGRAM: ""
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    extra_hosts:
      - host.docker.internal:host-gateway
    expose: ["9090"]
    volumes:
      - chen-data:/opt/chen/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/127.0.0.1/9090"]
      interval: 5s
      timeout: 2s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 15s
