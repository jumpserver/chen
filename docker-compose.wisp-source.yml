# Optional source build; apply after docker-compose.wisp-dev.yml.
services:
  wisp:
    build:
      context: .
      dockerfile: Dockerfile.wisp-dev
      additional_contexts:
        wisp-source: ${WISP_SOURCE:?Set WISP_SOURCE to a local Wisp source checkout}
    image: chen-wisp-source:local
    pull_policy: build
    command: []
