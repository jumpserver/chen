# Managed JumpServer component. Core is external to this project.
services:
  chen:
    image: ${CHEN_IMAGE:-jumpserver/chen:dev-ce}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CHEN_BASE_IMAGE: ${CHEN_BASE_IMAGE:-jumpserver/chen-base:go1.26.3-wisp0.2.15}
        VERSION: ${VERSION:-dev}
        WITH_DB2: ${WITH_DB2:-0}
    environment:
      CORE_HOST: ${CORE_HOST:-http://host.docker.internal:8080}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CHEN_HTTP_ADDR: 0.0.0.0:8082
      CHEN_STATE_DIR: /opt/chen/data/go
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${CHEN_PORT:-8082}:8082"
    volumes:
      - chen-data:/opt/chen/data
    restart: unless-stopped
    stop_grace_period: 55s
volumes:
  chen-data:
